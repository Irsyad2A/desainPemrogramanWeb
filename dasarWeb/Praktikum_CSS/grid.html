<!DOCTYPE html>
<html>

<head>
    <title>Grid</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            font-size: 30px;
            color: white;
            font-family: Arial;
            font-transform: uppercase;
            text-align: center;
        }

        .container {
            width: 60%;
            margin: 60px auto;
            border: 5px solid #333;
            box-sizing: border-box;
            display: grid;
            grid-template-areas:
                "header header"
                "nav main"
                "footer footer";
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
        }

        header {
            grid-area: header;
            background-color: #8B63DB;
            margin: 60px auto;
            justify-content: center;
        }

        aside {
            grid-area: aside;
            background-color: #2F7777;
            padding: 40px 0;
        }

        nav {
            grid-area: nav;
            background-color: #F4F765;
            padding: 100px 0;
        }

        main {
            grid-area: main;
            background-color: #F6B6A7;
            box-sizing: border-box;
            display: flex;
            flex: 1.5;
            justify-content: center;
            align-items: center;
        }

        footer {
            grid-area: footer;
            background-color: #866;
            padding: 30px 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>Header</header>
        <nav>Nav</nav>
        <main>Main</main>
        <footer>Footer</footer>
    </div>
</body>

</html>
