<html>

<head>
    <title>Bekerja dengan list</title>
</head>

<body>
    0rdered List
    <ol>
        <li>Satu</li>
        <li>Dua</li>
        <li>Tiga</li>
    </ol>
    <br>
    <hr>
    Unordered list
    <ul>
        <li>Satu</li>
        <li>dua</li>
        <li>tiga</li>
    </ul>
    <br>
    <hr>
    Definition List
    <dl>
        <dt>satu</dt>
        <dd>satu satu</dd>
        <dd>satu dua</dd>
        <dt>dua</dt>
        <dd>dua dua</dd>
    </dl>
</body>

</html>
